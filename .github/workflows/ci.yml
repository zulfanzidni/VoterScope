name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Enforce least-privilege permissions across the entire workflow
permissions:
  contents: read

# Cancel in-progress runs on pull requests when newer commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_ENV: test
  DATABASE_URL: "file:./dev.db"
  SESSION_SECRET: "ci-dummy-session-secret-change-in-production-use-32chars"
  NIK_ENCRYPTION_KEY: "ci-dummy-nik-encryption-key-demo"
  NIK_LOOKUP_SECRET: "ci-dummy-nik-lookup-secret-demo0"
  NEXT_PUBLIC_APP_NAME: "VoterScope Demo"
  CI: "true"

jobs:
  # ─── 1. CODE QUALITY GATE ──────────────────────────────────────────────────
  quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase (ESLint)
        run: npm run lint

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

  # ─── 2. UNIT & INTEGRATION TEST GATE ───────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage-report
          path: coverage/
          retention-days: 14

  # ─── 3. PRODUCTION COMPILATION BUILD GATE ─────────────────────────────────
  build:
    name: Production Build (Next.js Turbopack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js application
        env:
          NODE_ENV: production
        run: npm run build